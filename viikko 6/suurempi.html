
<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Suurempi luku</title>
</head>
<body>
  <h1>Testaa suurempi.js</h1>
  <script>
    let num1 = parseFloat(prompt("Enter the first number:"));
    let num2 = parseFloat(prompt("Enter the second number:"));

    function myComp(p1, p2) {
      if (p1 > p2) return p1;
      if (p2 > p1) return p2;
      return "yhtä suuret";
    }

    console.log("Suurempi on: " + myComp(num1, num2));
    alert("Suurempi on: " + myComp(num1, num2));
  </script>
</body>
</html>
